  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --indigo: #3B3DA8;
    --indigo-dark: #272893;
    --indigo-deeper: #1B1C6E;
    --indigo-light: #EEEFFE;
    --indigo-mid: #7B7FD4;
    --gold: #C98A10;
    --gold-light: #FDF6E3;

  /* ── HEADER ── */

  .header-inner {

  .logo-icon {

  .header-title .subtitle {

  /* ── SHARE BTN ── */
  .share-btn {

    display: flex;

    gap: 6px;
    transition: background 0.2s, transform 0.15s;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .share-btn:hover { background: rgba(255,255,255,0.26); transform: scale(1.03); }
  .share-btn:active { transform: scale(0.97); }

  /* ── INFO BADGE ── */
  .badge-wrap {
    max-width: 800px;
    margin: 0 auto;
    padding: 16px 16px 0;
  }

  .info-badge {
    background: var(--teal-light);
    border: 1.5px solid var(--teal);

    padding: 10px 16px;

    font-weight: 600;

    gap: 8px;
  }

  /* ── TAB NAV ── */
  .tabs-container {
    max-width: 800px;
    margin: 14px auto 0;
    padding: 0 12px;
  }

  .tabs-scroll {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }

  .tabs-scroll::-webkit-scrollbar { display: none; }

  .tab-btn {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 30px;
    padding: 8px 14px;
    font-size: 13px;
    font-family: 'Noto Sans Oriya', sans-serif;
    color: var(--text-muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.22s;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    font-weight: 400;
  }

  .tab-btn .tab-num {
    background: var(--indigo-light);
    color: var(--indigo);
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    transition: all 0.22s;
    flex-shrink: 0;
  }

  .tab-btn:hover {
    border-color: var(--indigo-mid);
    color: var(--indigo-dark);
    background: var(--indigo-light);
  }

  .tab-btn.active {
    background: var(--indigo);
    border-color: var(--indigo-dark);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 3px 12px rgba(59,61,168,0.35);
  }

  .tab-btn.active .tab-num {
    background: rgba(255,255,255,0.22);
    color: #fff;
  }

  /* ── IFRAME AREA ── */
  .frame-wrap {
    max-width: 800px;
    margin: 14px auto 0;
    padding: 0 12px 28px;
  }

  .frame-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .frame-topbar {
    background: var(--indigo-light);
    border-bottom: 1.5px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .frame-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--indigo-dark);
    display: flex;
    align-items: center;
    gap: 7px;
    flex: 1;
    min-width: 0;
  }

  .frame-title span.label-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .open-link-btn {
    background: var(--indigo);
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 6px 12px;
    font-size: 12px;
    font-family: 'Noto Sans Oriya', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: background 0.2s;
    text-decoration: none;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .open-link-btn:hover { background: var(--indigo-dark); }

  .iframe-container {
    position: relative;
    width: 100%;
    height: 70vh;
    min-height: 400px;
    max-height: 680px;
  }

  .content-iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .iframe-loader {
    position: absolute;
    inset: 0;
    background: var(--card);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 2;
    transition: opacity 0.4s;
  }

  .iframe-loader.hidden { opacity: 0; pointer-events: none; }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--indigo);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loader-text {
    font-size: 14px;
    color: var(--text-muted);
  }

  /* ── DECORATIVE STRIP ── */
  .color-strip {
    height: 4px;
    background: linear-gradient(90deg, var(--indigo-deeper), var(--indigo), var(--indigo-mid), var(--gold-mid));
    border-radius: 0 0 4px 4px;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #16153A;
    color: #fff;
    padding: 10px 22px;
    border-radius: 30px;
    font-size: 13px;
    white-space: nowrap;
    z-index: 9999;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
    opacity: 0;
    pointer-events: none;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 16px;
    font-size: 12px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    max-width: 800px;
    margin: 0 auto;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 480px) {
    .header-inner { padding: 11px 12px 10px; }
    .share-btn .share-label { display: none; }
    .tabs-container { padding: 0 8px; }
    .frame-wrap { padding: 0 8px 20px; }
    .iframe-container { height: 64vh; }
    .tab-btn { padding: 7px 11px; font-size: 12px; }
  }
</style>

<script type="application/ld+json">

<body>

      </div>

  <nav class="tabs-container" role="navigation" aria-label="ଅଧ୍ୟାୟ ଟ୍ୟାବ">

  <div class="frame-wrap">

      <div class="frame-topbar">

          <span class="label-text" id="active-label">ପୂର୍ବ ପ୍ରସ୍ତୁତି ଆଲୋଚନା</span>
        </div>
        <a class="open-link-btn" id="open-external" href="#" target="_blank" rel="noopener noreferrer" aria-label="ନୂଆ ଟ୍ୟାବ୍‌ରେ ଖୋଲନ୍ତୁ">

          id="content-frame"

<footer>
  <p>© LearnOdisha · ଓଡ଼ିଆ ମାଧ୍ୟମ ଶିକ୍ଷା · ବୈଦିକ ଗଣିତ ଚତୁର୍ଥ ଶ୍ରେଣୀ</p>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const TABS = [
  { label: "ପୂର୍ବ ପ୍ରସ୍ତୁତି ଆଲୋଚନା", ch: "୧", icon: "📖", url: "https://learnodishahelp-cmd.github.io/baidika4-1/" },
  { label: "ସଂଖ୍ୟା ଗଣନା",             ch: "୨", icon: "🔢", url: "https://learnodishahelp-cmd.github.io/baidika4-2/" },
  { label: "ବିନାକୁଲମ",                ch: "୩", icon: "🧩", url: "https://learnodishahelp-cmd.github.io/baidika4-3/" },
  { label: "ଗୁଣନ1",                    ch: "୪", icon: "✖️", url: "https://learnodishahelp-cmd.github.io/baidika4-4a/" },
  { label: "ଗୁଣନ2",                    ch: "୪", icon: "✖️", url: "https://learnodishahelp-cmd.github.io/baidika4-4b/" },
  { label: "ଗୁଣନ3",                    ch: "୪", icon: "✖️", url: "https://learnodishahelp-cmd.github.io/baidika4-4c/" },
  { label: "ହରଣ",                     ch: "୫", icon: "➗", url: "https://learnodishahelp-cmd.github.io/baidika4-5/" }
];

const SHARE_URL = "https://learnodishahelp-cmd.github.io/Quizmaster4/";

let activeIdx = 0;
const scrollEl    = document.querySelector('.tabs-scroll');
const iframe      = document.getElementById('content-frame');
const loader      = document.getElementById('iframe-loader');
const activeLabel = document.getElementById('active-label');
const activeIcon  = document.getElementById('active-icon');
const openExt     = document.getElementById('open-external');

function buildTabs() {
  TABS.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    btn.setAttribute('aria-label', t.label);
    btn.innerHTML = `<span class="tab-num">${t.ch}</span>${t.label}`;
    btn.addEventListener('click', () => switchTab(i));
    scrollEl.appendChild(btn);
  });
}

function switchTab(idx) {
  if (idx === activeIdx) return;
  activeIdx = idx;
  scrollEl.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', i === idx);
    b.setAttribute('aria-selected', i === idx ? 'true' : 'false');
  });
  loadFrame(TABS[idx]);
  scrollEl.querySelectorAll('.tab-btn')[idx]
    .scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

function loadFrame(tab) {
  loader.classList.remove('hidden');
  loader.style.opacity = '1';
  iframe.src = 'about:blank';
  activeLabel.textContent = tab.label;
  activeIcon.textContent  = tab.icon;
  openExt.href = tab.url;
  openExt.setAttribute('aria-label', tab.label + ' — ନୂଆ ଟ୍ୟାବ୍‌ରେ ଖୋଲନ୍ତୁ');
  setTimeout(() => { iframe.src = tab.url; }, 120);
}

iframe.addEventListener('load', () => {
  if (iframe.src === 'about:blank') return;
  loader.style.opacity = '0';
  setTimeout(() => loader.classList.add('hidden'), 420);
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function shareApp() {
  if (navigator.share) {
    navigator.share({
      title: 'ବୈଦିକ ଗଣିତ – ଚତୁର୍ଥ ଶ୍ରେଣୀ',
      text: 'ଓଡ଼ିଆ ବୈଦିକ ଗଣିତ ଅଭ୍ୟାସ — ଅଧ୍ୟାୟ ୧ ରୁ ୫',
      url: SHARE_URL
    }).catch(() => {});
  } else {
    navigator.clipboard.writeText(SHARE_URL).then(() => {
      showToast('🔗 ଲିଙ୍କ କପି ହୋଇଗଲା!');
    }).catch(() => {
      showToast('ଲିଙ୍କ: ' + SHARE_URL);
    });
  }
}

buildTabs();
loadFrame(TABS[0]);
</script>
